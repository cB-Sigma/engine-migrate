groups:
  - name: vllm
    rules:
      - alert: VllmQueueBacklog
        expr: sum by (model_name) (vllm:num_requests_waiting) > 50
        for: 5m
        labels:
          severity: page
      - alert: VllmAdmissionRejections
        expr: sum by (model_name, reason) (rate(vllm:admission_rejections_total[5m])) > 0
        for: 10m
        labels:
          severity: warn
      - alert: VllmSlowFirstToken
        expr: |
          histogram_quantile(0.99,
            sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket[5m]))
          ) > 2
        for: 10m
      - record: vllm:tokens_per_second:rate5m
        expr: sum by (model_name) (rate(vllm:generation_tokens_total[5m]))
