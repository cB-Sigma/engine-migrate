[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engine-migrate"
dynamic = ["version"]
description = "Translate LLM serving configs between inference engines, diff engine versions, and lint dashboards against an engine's metrics - from a database extracted statically from engine source."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The engine-migrate Authors" }]
keywords = ["llm", "inference", "serving", "vllm", "sglang", "llama.cpp", "tgi", "ollama", "prometheus", "grafana", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=5.1",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/cb-Sigma/engine-migrate"
Issues = "https://github.com/cb-Sigma/engine-migrate/issues"
Changelog = "https://github.com/cb-Sigma/engine-migrate/blob/main/CHANGELOG.md"

[project.scripts]
engine-migrate = "engine_migrate.cli:main"

[tool.hatch.version]
path = "src/engine_migrate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_migrate"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/docs", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/CONTRIBUTING.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
ignore = ["E501", "SIM108", "RUF001", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/engine_migrate", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
